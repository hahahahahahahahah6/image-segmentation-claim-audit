[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "image-segmentation-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor for labelled picture regions"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
image-segmentation-claim-audit = "image_segmentation_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["image_segmentation_claim_audit*"]
